name: dentra_mobile
description: DENTRA — AI-assisted dental imaging mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  video_player: ^2.9.2
  fvp: ^0.38.1
  flutter_riverpod: ^2.6.1
  geolocator: ^13.0.2
  google_maps_flutter: ^2.18.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  image_picker: ^1.1.2
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/treatments/
    - assets/videos/
