name: dentra_mobile
description: DENTRA — AI-assisted dental imaging mobile application.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  geolocator: ^13.0.2
  google_maps_flutter: ^2.18.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  image_picker: ^1.1.2
  shared_preferences: 2.5.5
  google_sign_in: 7.2.0
  flutter_secure_storage: 11.2.0
  file_selector: 1.1.0
  pdf: 3.11.3
  printing: 5.14.2
  image: 4.5.4
  universal_ble: 3.2.0
  wakelock_plus: 1.8.2
  web_socket_channel: 3.0.3
  vector_graphics: 1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Compiles the SVG icons at build time (see the transformer below).
  vector_graphics_compiler: 1.3.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - path: assets/images/icons/
      transformers:
        - package: vector_graphics_compiler
    - assets/images/mascot/
    - assets/images/treatments/
    - assets/images/treatments/icons/
    - assets/fonts/
