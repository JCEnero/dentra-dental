<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="DENTRA - AI-assisted dental imaging">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dentra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Outfit font from Google Fonts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <!-- Bump ?v= when the icon changes; browsers cache favicons stubbornly. -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>Dentra</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Force full-screen layout */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Matches the splash backdrop, so reloads never flash another color. */
      background-color: #E2F5F3;
    }
    /* Flutter's own layers fill the viewport. Kept off bare `canvas`,
       which would also stretch the canvases Google Maps draws into. */
    flt-glass-pane, flt-scene-host, flt-scene {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
